name: CI

on:
  push:
    branches: [master]
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Run tests
        uses: tree-sitter/parser-test-action@v2
        with:
          generate: false
          test-rust: true
      - name: Clone Objective-C repository
        uses: actions/checkout@v4
        with:
          path: examples/objc4
          repository: apple-oss-distributions/objc4
      - name: Clone LLVM repository
        uses: actions/checkout@v4
        with:
          path: examples/llvm
          repository: llvm/llvm-project
          sparse-checkout: clang/
      - name: Parse examples
        uses: tree-sitter/parse-action@v4
        with:
          files: |
            examples/**/*.m
            !examples/llvm/clang/test/Lexer/minimize_source_to_dependency_directives_at_import_extra_tokens.m
            !examples/llvm/clang/test/Lexer/minimize_source_to_dependency_directives_at_import_missing_semi.m
          invalid-files: |
            examples/llvm/clang/test/ARCMT/GC-check.m
            examples/llvm/clang/test/ARCMT/nonobjc-to-objc-cast.m
            examples/llvm/clang/test/ARCMT/objcmt-arc-cf-annotations.m
            examples/llvm/clang/test/ARCMT/objcmt-atomic-property.m
